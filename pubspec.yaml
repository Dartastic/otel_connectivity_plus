name: otel_connectivity_plus
description: >-
  OpenTelemetry instrumentation for connectivity_plus by Dartastic.io. Adds
  standard OpenTelemetry observability to applications that use
  connectivity_plus.
version: 0.3.1
repository: https://github.com/dartastic/otel_connectivity_plus
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  connectivity_plus: ">=6.0.0 <8.0.0"
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  flutter:
    sdk: flutter

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
